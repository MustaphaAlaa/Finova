  rabbitmq:
    image: rabbitmq:4-management
    container_name: finova-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: finova
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - finova-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  finova-outbox-worker:
    container_name: finova-outbox-worker-dev
    build:
      context: "./Wallet"
      dockerfile: Host/Finova.Workers/Dockerfile.OutboxWorker.dev
    restart: always
    depends_on:
      finova-database:
        condition: service_healthy
      finova-wallet:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./Wallet/Host/Finova.Workers/OutboxWorker:/app/src/finova-wallet/Host/Finova.Workers/OutboxWorker
    networks:
      - finova-net
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__finovaWalletDb: Host=finova-database;Database=FinovaDb;Username=finovaAdmin;Password=0000;SSL Mode=Prefer;Include Error Detail=true;
    stdin_open: true
    tty: true

  finova-wallet:
    container_name: finova-wallet-dev
    build:
      context: "./Wallet"
      dockerfile: Dockerfile.finova-wallet.dev
    restart: always
    depends_on:
      finova-database:
        condition: service_healthy
    volumes:
      - ./Wallet/:/src/finova-wallet
    networks:
      - finova-net
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__finovaWalletDb: Host=finova-database;Database=FinovaDb;Username=finovaAdmin;Password=0000;SSL Mode=Prefer;Include Error Detail=true;
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  finova-database:
    image: postgres:17
    container_name: finova_postgreSQL_db
    environment:
      POSTGRES_USER: finovaAdmin
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: FinovaDb
    ports:
      - "6800:5432"
    volumes:
      - finova_postgres_data:/var/lib/postgresql/data
    networks:
      - finova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finovaAdmin -d FinovaDb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finova_redis_cache:
  finova_postgres_data:
  rabbitmq-data:

networks:
  finova-net:
    driver: bridge
